<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Arqis technical architecture</title>
  <desc id="desc">Frontend app connects wallet users to Arc Testnet, the Arqis invoice registry, prototype data services, and external infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f3b6d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#54709a"/>
    </marker>
  </defs>

  <rect width="960" height="460" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213d">Technical Architecture</text>
  <text x="48" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#52627a">Arqis owns the invoice UX and proof references while relying on Arc ecosystem infrastructure for settlement.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="360" y="132" width="240" height="120" rx="22" fill="url(#blue)"/>
      <text x="480" y="178" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Arqis Frontend</text>
      <text x="480" y="206" text-anchor="middle" font-size="14" fill="#eaf4ff">Create invoice · Pay invoice</text>
      <text x="480" y="226" text-anchor="middle" font-size="14" fill="#eaf4ff">Seller console · Setup helpers</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="60" y="142" width="210" height="92" rx="18" fill="#ffffff" stroke="#d9e6f8"/>
      <text x="165" y="181" text-anchor="middle" font-size="18" font-weight="700" fill="#17233c">Seller / Payer</text>
      <text x="165" y="207" text-anchor="middle" font-size="13" fill="#5d6b82">Browser + wallet user</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="690" y="142" width="210" height="92" rx="18" fill="#ffffff" stroke="#d9e6f8"/>
      <text x="795" y="181" text-anchor="middle" font-size="18" font-weight="700" fill="#17233c">Wallet</text>
      <text x="795" y="207" text-anchor="middle" font-size="13" fill="#5d6b82">Signing + Arc Testnet txs</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="78" y="322" width="222" height="86" rx="18" fill="#ffffff" stroke="#d9e6f8"/>
      <text x="189" y="358" text-anchor="middle" font-size="17" font-weight="700" fill="#17233c">Data Layer / Services</text>
      <text x="189" y="383" text-anchor="middle" font-size="13" fill="#5d6b82">Prototype state where configured</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="369" y="312" width="222" height="106" rx="18" fill="#ffffff" stroke="#d9e6f8"/>
      <text x="480" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#17233c">ArqisInvoiceRegistry</text>
      <text x="480" y="375" text-anchor="middle" font-size="13" fill="#5d6b82">Arc Testnet proof events</text>
      <text x="480" y="395" text-anchor="middle" font-size="13" fill="#5d6b82">Invoice/payment references</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="660" y="322" width="222" height="86" rx="18" fill="#ffffff" stroke="#d9e6f8"/>
      <text x="771" y="358" text-anchor="middle" font-size="17" font-weight="700" fill="#17233c">External Infrastructure</text>
      <text x="771" y="383" text-anchor="middle" font-size="13" fill="#5d6b82">Arcscan · Circle · future liquidity</text>
    </g>

    <path d="M272 188 H354" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M606 188 H684" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M420 255 C360 286 288 307 230 321" fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M480 255 V306" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M540 255 C604 287 675 307 731 321" fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M795 236 C786 270 778 292 774 316" fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>

  <text x="48" y="438" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#65748b">Boundary: the current MVP records invoice proof and payment references; it is not custody, bridging, or production payment verification.</text>
</svg>
